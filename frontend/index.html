<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySirati - AI-Ready Professional Career Profile & JSON Resume</title>
    <meta
      name="description"
      content="Manage your professional career profile, projects, skills, and credentials with granular AI-ready JSON Resume share links."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('mysirati_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (
            storedTheme === 'dark' ||
            ((!storedTheme || storedTheme === 'system') && prefersDark)
          ) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          /* Fallback safely without blocking */
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased min-h-screen selection:bg-primary-soft selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
